<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citizen Services Portal - Live Layout Fixture</title>
</head>
<body>
  <div class="container">
    <form id="citizen-form">
      <div class="form-group">
        <label for="applicant-name">Candidate Full Name / अभ्यर्थी का नाम <span class="required">*</span></label>
        <input type="text" id="applicant-name" name="applicantName" placeholder="e.g. SANJAY KUMAR" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="applicant-dob">Date of Birth / जन्म तिथि <span class="required">*</span></label>
        <input type="text" id="applicant-dob" name="applicantDob" placeholder="DD/MM/YYYY" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="applicant-district">District / जिला <span class="required">*</span></label>
        <input type="text" id="applicant-district" name="applicantDistrict" placeholder="e.g. VARANASI" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="applicant-ref-no">Application / Roll Number / संदर्भ संख्या <span class="required">*</span></label>
        <input type="text" id="applicant-ref-no" name="applicantRefNo" placeholder="e.g. 962081" required autocomplete="off">
      </div>
      <div class="button-row">
        <button type="submit" id="btn-submit-form" class="btn-submit">Submit Application</button>
      </div>
    </form>
  </div>
</body>
</html>
