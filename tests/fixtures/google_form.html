<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Forms Live Layout Fixture</title>
</head>
<body>
  <div class="form-container">
    <form id="google-form-simulation">
      <div class="question-card" role="listitem">
        <div class="question-title" role="heading" aria-level="3">
          <span class="M7eMe">Candidate Full Name / अभ्यर्थी का नाम</span>
          <span class="required-star">*</span>
        </div>
        <input type="text" name="entry.10492817" class="whsOnd" aria-label="Candidate Full Name / अभ्यर्थी का नाम" placeholder="Your answer" required autocomplete="off">
      </div>

      <div class="question-card" role="listitem">
        <div class="question-title" role="heading" aria-level="3">
          <span class="M7eMe">Date of Birth / जन्म तिथि</span>
          <span class="required-star">*</span>
        </div>
        <input type="text" name="entry.28491028" class="whsOnd" aria-label="Date of Birth / जन्म तिथि" placeholder="DD/MM/YYYY" required autocomplete="off">
      </div>

      <div class="question-card" role="listitem">
        <div class="question-title" role="heading" aria-level="3">
          <span class="M7eMe">Permanent District / स्थायी जिला</span>
          <span class="required-star">*</span>
        </div>
        <input type="text" name="entry.73819204" class="whsOnd" aria-label="Permanent District / स्थायी जिला" placeholder="Your answer" required autocomplete="off">
      </div>

      <div class="question-card" role="listitem">
        <div class="question-title" role="heading" aria-level="3">
          <span class="M7eMe">Application / Reference Number / संदर्भ संख्या</span>
          <span class="required-star">*</span>
        </div>
        <input type="text" name="entry.91827364" class="whsOnd" aria-label="Application / Reference Number / संदर्भ संख्या" placeholder="Your answer" required autocomplete="off">
      </div>

      <div class="actions-bar">
        <div role="button" id="gf-btn-submit" class="gf-submit-btn" tabindex="0">
          <span>Submit</span>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
